<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hrací kostka</title>
    <style>
        /* CSS: Vzhled a stylování stránky */
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            min-width: 260px;
        }

        h1 {
            color: #333;
            margin-top: 0;
        }

        /* Vizuální podoba kostky s tečkami */
        .dice {
            width: 100px;
            height: 100px;
            background-color: #fff;
            border: 3px solid #333;
            border-radius: 16px;
            margin: 20px auto;
            padding: 10px;
            box-sizing: border-box;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.05);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            place-items: center;
        }

        .dot {
            width: 16px;
            height: 16px;
            background-color: #333;
            border-radius: 50%;
        }

        /* Animace hodu */
        .dice.rolling {
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%   { transform: rotate(0deg) scale(1); }
            25%  { transform: rotate(-20deg) scale(1.1); }
            50%  { transform: rotate(20deg) scale(1.1); }
            75%  { transform: rotate(-10deg) scale(1.05); }
            100% { transform: rotate(0deg) scale(1); }
        }

        .info {
            color: #555;
            margin-bottom: 15px;
            min-height: 1.2em;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #0056b3;
        }

        button:disabled {
            background-color: #7aaee6;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Hrací kostka</h1>

        <div id="dice" class="dice"></div>

        <div id="info" class="info">Zatím jste nehodili.</div>

        <button id="btn" onclick="hodKostkou()">Hodit kostkou</button>
    </div>

    <script>
        // Pozice teček v mřížce 3x3 (čísla 1-9) pro každou hodnotu kostky
        const tecky = {
            1: [5],
            2: [1, 9],
            3: [1, 5, 9],
            4: [1, 3, 7, 9],
            5: [1, 3, 5, 7, 9],
            6: [1, 3, 4, 6, 7, 9]
        };

        let pocetHodu = 0;
        let soucet = 0;

        const kostkaElement = document.getElementById("dice");
        const infoElement = document.getElementById("info");
        const tlacitko = document.getElementById("btn");

        function zobrazKostku(cislo) {
            kostkaElement.innerHTML = "";
            tecky[cislo].forEach(pozice => {
                const tecka = document.createElement("div");
                tecka.className = "dot";
                tecka.style.gridArea = Math.ceil(pozice / 3) + " / " + (((pozice - 1) % 3) + 1);
                kostkaElement.appendChild(tecka);
            });
        }

        function hodKostkou() {
            tlacitko.disabled = true;
            kostkaElement.classList.add("rolling");

            // Během animace se rychle střídají náhodné hodnoty
            const interval = setInterval(() => {
                zobrazKostku(Math.floor(Math.random() * 6) + 1);
            }, 80);

            setTimeout(() => {
                clearInterval(interval);
                const cislo = Math.floor(Math.random() * 6) + 1;
                zobrazKostku(cislo);

                pocetHodu++;
                soucet += cislo;
                infoElement.textContent = `Padlo: ${cislo} | Hodů: ${pocetHodu} | Součet: ${soucet}`;

                kostkaElement.classList.remove("rolling");
                tlacitko.disabled = false;
            }, 500);
        }

        // Úvodní zobrazení
        zobrazKostku(6);
    </script>

</body>
</html>
